services:
  booking_back_service:
    container_name: "booking_back"
    build:
      context: .
    #ports:
    # - "7777:8000"
    networks:
      - myNetwork
    env_file:
      - .env


  booking_celery_service:
    container_name: "booking_celery_worker"
    build:
      context: .
    networks:
      - myNetwork
    env_file:
      - .env
    command: "celery --app=src.tasks.celery_app:celery_instance worker -l INFO"



  booking_celery_beat_service:
    container_name: "booking_celery_beat"
    build:
      context: .
    networks:
      - myNetwork
    env_file:
      - .env
    command: "celery --app=src.tasks.celery_app:celery_instance beat -l INFO"


  nginx:
    image: nginx:latest
    container_name: nginx_booking
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - booking_back_service
    networks:
      - myNetwork


networks:
  myNetwork:
    external: True
